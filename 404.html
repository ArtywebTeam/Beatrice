<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Pagina Non Trovata | Beatrice Hair Salon</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background-color: var(--bg-primary);
    }
    .not-found-card {
      max-width: 28rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .not-found-code {
      font-family: var(--font-heading);
      font-size: 5rem;
      line-height: 1;
      color: var(--color-gold);
    }
    .not-found-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      line-height: 1.2;
    }
    .not-found-text {
      color: var(--text-muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <div class="not-found-card">
      <h1 class="not-found-code">404</h1>
      <h2 class="not-found-title">Pagina Non Trovata / Page Not Found</h2>
      <p class="not-found-text">La pagina che stai cercando non esiste o è stata spostata.</p>
      <a href="index.html" class="gold-button">Torna alla Home / Back to Home</a>
    </div>
  </div>
</body>
</html>
